<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="450" height="160" rx="10" fill="url(#flowBg)"/>

  <!-- Left: Standard Base Gaussian Distribution p(z) -->
  <g transform="translate(45, 30)">
    <path d="M 0,80 Q 35,80 50,20 Q 65,80 100,80" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 0,80 Q 35,80 50,20 Q 65,80 100,80 Z" fill="#64748b" opacity="0.15"/>
    <text x="50" y="105" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Base Density p(z)</text>
  </g>

  <!-- Invertible Bijective Flow Transformations f_1, f_2, ... f_K -->
  <g transform="translate(170, 45)">
    <!-- Flow Block 1 -->
    <rect x="0" y="10" width="36" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="34" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">f_1</text>
    
    <path d="M 40,30 L 52,30" stroke="#818cf8" stroke-width="2"/>
    <polygon points="52,27 58,30 52,33" fill="#818cf8"/>

    <!-- Flow Block 2 -->
    <rect x="62" y="10" width="36" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="80" y="34" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">f_K</text>
    
    <text x="50" y="72" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8">RealNVP / Flows</text>
  </g>

  <path d="M 275,75 L 295,75" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="295,72 303,75 295,78" fill="#38bdf8"/>

  <!-- Right: Complex Multimodal Target Distribution p(x) for food security -->
  <g transform="translate(305, 30)">
    <path d="M 0,80 Q 20,80 30,35 Q 45,65 60,15 Q 75,55 85,45 Q 95,80 115,80" fill="none" stroke="url(#curve1)" stroke-width="2.5"/>
    <path d="M 0,80 Q 20,80 30,35 Q 45,65 60,15 Q 75,55 85,45 Q 95,80 115,80 Z" fill="url(#curve1)" opacity="0.2"/>
    <text x="57" y="105" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Food Security p(x)</text>
  </g>

  <g transform="translate(15, 12)">
    <text x="0" y="0" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8" font-weight="600" opacity="0.6">ISI FOUNDATION RESEARCH</text>
  </g>
</svg>
