<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pFactifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </linearGradient>
    <linearGradient id="pFactifyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="460" height="260" rx="12" fill="url(#pFactifyBg)" stroke="#2b1f3c" stroke-width="1.5"/>

  <!-- Top label -->
  <text x="24" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">FACTIFY-5WQA FRAMEWORK · ACL 2023</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Input Multimodal Claim -->
  <g transform="translate(24, 48)">
    <rect width="100" height="84" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="50" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Input Claim</text>
    <rect x="8" y="32" width="84" height="20" rx="4" fill="#1e293b"/>
    <text x="50" y="45" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Complex News</text>
    <rect x="8" y="56" width="84" height="20" rx="4" fill="#3b1d4c"/>
    <text x="50" y="69" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Multi-sentence</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 128 90 L 148 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="152,90 145,86 145,94" fill="#f472b6"/>

  <!-- Box 2: 5W Aspect Decomposition -->
  <g transform="translate(154, 48)">
    <rect width="150" height="84" rx="8" fill="#241635" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="75" y="22" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">5W Aspect Parsing</text>
    
    <g transform="translate(8, 30)">
      <rect x="0" y="0" width="24" height="15" rx="3" fill="#083344"/>
      <text x="12" y="11" fill="#67e8f9" font-size="7" font-weight="700" text-anchor="middle">Who</text>

      <rect x="27" y="0" width="24" height="15" rx="3" fill="#083344"/>
      <text x="39" y="11" fill="#67e8f9" font-size="7" font-weight="700" text-anchor="middle">What</text>

      <rect x="54" y="0" width="25" height="15" rx="3" fill="#083344"/>
      <text x="66" y="11" fill="#67e8f9" font-size="7" font-weight="700" text-anchor="middle">When</text>

      <rect x="82" y="0" width="25" height="15" rx="3" fill="#083344"/>
      <text x="94" y="11" fill="#67e8f9" font-size="7" font-weight="700" text-anchor="middle">Where</text>

      <rect x="110" y="0" width="24" height="15" rx="3" fill="#083344"/>
      <text x="122" y="11" fill="#67e8f9" font-size="7" font-weight="700" text-anchor="middle">Why</text>
    </g>

    <rect x="8" y="52" width="134" height="24" rx="4" fill="#164e63"/>
    <text x="75" y="67" fill="#cffafe" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Targeted QA Generator</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 308 90 L 328 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="332,90 325,86 325,94" fill="#f472b6"/>

  <!-- Box 3: Verification Verdict -->
  <g transform="translate(334, 48)">
    <rect width="102" height="84" rx="8" fill="#241635" stroke="#ec4899" stroke-width="1.2"/>
    <text x="51" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Aspect Verdict</text>
    <rect x="8" y="34" width="86" height="18" rx="4" fill="#14532d"/>
    <text x="51" y="46" fill="#86efac" font-family="system-ui, sans-serif" font-size="7.8" font-weight="700" text-anchor="middle">Supported</text>
    <rect x="8" y="56" width="86" height="18" rx="4" fill="#881337"/>
    <text x="51" y="68" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="7.8" font-weight="700" text-anchor="middle">Refuted</text>
  </g>

  <!-- Bottom visual: Decomposition Grid -->
  <g transform="translate(24, 150)">
    <rect width="412" height="90" rx="8" fill="#1b1228" stroke="#372046" stroke-width="1"/>
    <text x="16" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Cross-Aspect Question Answering Alignment:</text>
    
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="180" height="20" rx="4" fill="#241635" stroke="#4a2559" stroke-width="1"/>
      <text x="10" y="13" fill="#cbd5e1" font-size="7.5">Q: When did the event happen?</text>

      <path d="M 188 10 L 220 10" stroke="#06b6d4" stroke-width="1.5"/>

      <rect x="228" y="0" width="150" height="20" rx="4" fill="#083344" stroke="#0e7490" stroke-width="1"/>
      <text x="238" y="13" fill="#67e8f9" font-size="7.5">A: Verified via Evidence</text>
    </g>

    <text x="16" y="78" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" opacity="0.8">ACL 2023 · Long Paper · Aspect-Based Explainable Verification</text>
  </g>
</svg>
