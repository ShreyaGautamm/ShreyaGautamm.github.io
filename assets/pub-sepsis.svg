<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pSepsisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </linearGradient>
    <linearGradient id="pSepsisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="460" height="260" rx="12" fill="url(#pSepsisBg)" stroke="#372248" stroke-width="1.5"/>

  <!-- Top label -->
  <text x="24" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">SEPSIS ARCHITECTURE · ACL 2025</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Multi-Party Dialogue -->
  <g transform="translate(24, 48)">
    <rect width="115" height="84" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Dialogue Stream</text>
    <rect x="10" y="32" width="95" height="15" rx="3" fill="#1e293b"/>
    <text x="57" y="43" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Speaker Turns</text>
    <rect x="10" y="50" width="95" height="15" rx="3" fill="#3b1d4c"/>
    <text x="57" y="61" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Context History</text>
    <text x="57" y="76" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Conversational Cues</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 143 90 L 165 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="169,90 162,86 162,94" fill="#f472b6"/>

  <!-- Box 2: Psychological & Cognitive Extractor -->
  <g transform="translate(173, 48)">
    <rect width="115" height="84" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Leakage Modeling</text>
    <text x="57" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">Psycholinguistic cues</text>
    <text x="57" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">Cognitive load metrics</text>
    <rect x="10" y="62" width="95" height="14" rx="3" fill="#311942"/>
    <text x="57" y="72" fill="#e879f9" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Inconsistency Detector</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 292 90 L 314 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="318,90 311,86 311,94" fill="#f472b6"/>

  <!-- Box 3: Verification Output -->
  <g transform="translate(322, 48)">
    <rect width="114" height="84" rx="8" fill="#241635" stroke="#ec4899" stroke-width="1.2"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SEPSIS Decision</text>
    <rect x="10" y="34" width="94" height="18" rx="4" fill="#14532d"/>
    <text x="57" y="46" fill="#86efac" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Truth Verified</text>
    <rect x="10" y="56" width="94" height="18" rx="4" fill="#881337"/>
    <text x="57" y="68" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Deception Flagged</text>
  </g>

  <!-- Bottom visual: Multi-turn reasoning map -->
  <g transform="translate(24, 150)">
    <rect width="412" height="90" rx="8" fill="#1b1228" stroke="#372046" stroke-width="1"/>
    <text x="16" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Cross-turn Inconsistency Analysis:</text>
    
    <g transform="translate(16, 34)">
      <circle cx="15" cy="18" r="10" fill="#38bdf8" opacity="0.3"/>
      <circle cx="15" cy="18" r="5" fill="#38bdf8"/>
      <text x="35" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8">Speaker Claim (t=1)</text>

      <path d="M 125 18 L 165 18" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2"/>

      <circle cx="180" cy="18" r="10" fill="#ec4899" opacity="0.3"/>
      <circle cx="180" cy="18" r="5" fill="#ec4899"/>
      <text x="200" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8">Contradictory Detail (t=5)</text>

      <rect x="315" y="8" width="65" height="20" rx="4" fill="#4c0519" stroke="#be123c" stroke-width="1"/>
      <text x="347" y="21" fill="#fda4af" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Leakage Δ</text>
    </g>

    <text x="16" y="78" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" opacity="0.8">ACL 2025 · Student Research Workshop · High Explainability Deception Detection</text>
  </g>
</svg>
