<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="umlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#umlBg)"/>

  <!-- UML Class Box 1: User -->
  <g transform="translate(40, 50)">
    <rect width="90" height="95" rx="6" fill="#09090b" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect width="90" height="24" rx="6" fill="#27272a"/>
    <text x="45" y="16" text-anchor="middle" fill="#fafafa" font-family="monospace" font-size="10" font-weight="700">&lt;&lt;User&gt;&gt;</text>
    <line x1="0" y1="24" x2="90" y2="24" stroke="#a1a1aa" stroke-width="1"/>
    <text x="8" y="42" fill="#a1a1aa" font-family="monospace" font-size="8">- id: UUID</text>
    <text x="8" y="56" fill="#a1a1aa" font-family="monospace" font-size="8">- role: String</text>
    <line x1="0" y1="64" x2="90" y2="64" stroke="#3f3f46" stroke-width="1"/>
    <text x="8" y="80" fill="#38bdf8" font-family="monospace" font-size="8">+ login()</text>
  </g>

  <!-- Association arrow -->
  <line x1="130" y1="95" x2="185" y2="95" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="185,91 195,95 185,99" fill="#38bdf8"/>
  <text x="160" y="88" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="8">1..*</text>

  <!-- UML Class Box 2: ModelRunner -->
  <g transform="translate(195, 40)">
    <rect width="110" height="115" rx="6" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="110" height="24" rx="6" fill="#0369a1"/>
    <text x="55" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">ModelRunner</text>
    <line x1="0" y1="24" x2="110" y2="24" stroke="#38bdf8" stroke-width="1"/>
    <text x="8" y="42" fill="#bae6fd" font-family="monospace" font-size="8">+ model: LLM</text>
    <text x="8" y="56" fill="#bae6fd" font-family="monospace" font-size="8">+ temp: Float</text>
    <line x1="0" y1="66" x2="110" y2="66" stroke="#0369a1" stroke-width="1"/>
    <text x="8" y="82" fill="#38bdf8" font-family="monospace" font-size="8">+ generateUML()</text>
    <text x="8" y="98" fill="#38bdf8" font-family="monospace" font-size="8">+ validateSyntax()</text>
  </g>

  <!-- LLM Evaluation Benchmark Tag -->
  <g transform="translate(30, 20)">
    <rect width="140" height="20" rx="4" fill="#3f3f46"/>
    <text x="70" y="14" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="9" font-weight="700">GPT-4 vs GEMINI vs LLAMA</text>
  </g>
</svg>
