<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#finBg)"/>

  <!-- Grid lines -->
  <line x1="40" y1="50" x2="360" y2="50" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="90" x2="360" y2="90" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="130" x2="360" y2="130" stroke="#1e293b" stroke-width="1"/>

  <!-- Candlesticks & Area Chart -->
  <path d="M 40,140 Q 90,130 130,110 T 210,90 T 280,60 T 360,40 L 360,160 L 40,160 Z" fill="url(#chartGrad)"/>
  <path d="M 40,140 Q 90,130 130,110 T 210,90 T 280,60 T 360,40" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Agent Dots / Nodes -->
  <g transform="translate(130, 110)">
    <circle r="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text text-anchor="middle" dy="3.5" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700">A1</text>
  </g>

  <g transform="translate(210, 90)">
    <circle r="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text text-anchor="middle" dy="3.5" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="8" font-weight="700">A2</text>
  </g>

  <g transform="translate(280, 60)">
    <circle r="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">A3</text>
  </g>

  <g transform="translate(360, 40)">
    <circle r="16" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9" font-weight="800">+28%</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(30, 20)">
    <rect width="130" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">5-AGENT WORKFLOW</text>
  </g>

  <g transform="translate(170, 20)">
    <rect width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">STREAMLIT UI</text>
  </g>
</svg>
