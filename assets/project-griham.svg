<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grihamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#grihamBg)"/>

  <!-- Figma UI Mobile Screen Mockup 1 -->
  <g transform="translate(100, 25)">
    <rect width="90" height="155" rx="12" fill="#18181b" stroke="#71717a" stroke-width="2"/>
    <!-- Status bar -->
    <rect x="30" y="6" width="30" height="4" rx="2" fill="#3f3f46"/>
    <!-- House Hero Picture -->
    <rect x="8" y="18" width="74" height="45" rx="6" fill="#ea580c"/>
    <path d="M 45,26 L 25,44 L 65,44 Z" fill="#ffffff" opacity="0.9"/>
    <!-- App Details -->
    <rect x="8" y="70" width="55" height="6" rx="2" fill="#fafafa"/>
    <rect x="8" y="82" width="40" height="5" rx="2" fill="#71717a"/>
    <!-- Community Match Chip -->
    <rect x="8" y="96" width="74" height="22" rx="4" fill="#27272a" stroke="#ea580c"/>
    <text x="45" y="110" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="7" font-weight="700">CHORES: -30% RENT</text>
    <!-- CTA Button -->
    <rect x="8" y="126" width="74" height="16" rx="4" fill="#f97316"/>
    <text x="45" y="137" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">Join Shared Home</text>
  </g>

  <!-- Figma UI Screen Mockup 2 (Community) -->
  <g transform="translate(210, 45)">
    <rect width="90" height="135" rx="12" fill="#18181b" stroke="#ea580c" stroke-width="2"/>
    <rect x="30" y="6" width="30" height="4" rx="2" fill="#3f3f46"/>
    <!-- Roommates Profile avatars -->
    <circle cx="28" cy="35" r="12" fill="#3b82f6"/>
    <circle cx="58" cy="35" r="12" fill="#ec4899"/>
    <rect x="15" y="58" width="60" height="6" rx="2" fill="#fafafa"/>
    <rect x="15" y="70" width="50" height="5" rx="2" fill="#71717a"/>
    <!-- Matching Score -->
    <rect x="12" y="88" width="66" height="30" rx="6" fill="#431407" stroke="#f97316"/>
    <text x="45" y="102" text-anchor="middle" fill="#ea580c" font-family="system-ui, sans-serif" font-size="8" font-weight="800">98% COMPATIBLE</text>
    <text x="45" y="112" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="7" font-weight="500">Milan Co-housing</text>
  </g>

  <!-- Figma Badge -->
  <g transform="translate(30, 20)">
    <rect width="105" height="22" rx="4" fill="#c2410c"/>
    <text x="52" y="15" text-anchor="middle" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="9" font-weight="700">FIGMA UX PROTOTYPE</text>
  </g>
</svg>
