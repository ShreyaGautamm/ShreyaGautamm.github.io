<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <defs>
    <linearGradient id="biasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="maleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="femaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="450" height="160" rx="10" fill="url(#biasBg)"/>

  <!-- Centroid Bias Distribution Bar Chart Comparison across Persona conditioning -->
  <!-- Label Left: Traits -->
  <g transform="translate(30, 30)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Dark Triad Persona</text>
    <rect x="120" y="8" width="160" height="16" rx="4" fill="url(#maleGrad)"/>
    <text x="290" y="20" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9" font-weight="700">+27% Bias Amplification</text>

    <text x="0" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Baseline (Neutral)</text>
    <rect x="120" y="43" width="100" height="16" rx="4" fill="#64748b" opacity="0.7"/>
    <text x="230" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Benchmark Reference</text>

    <text x="0" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Honesty-Humility</text>
    <rect x="120" y="78" width="55" height="16" rx="4" fill="#10b981"/>
    <text x="185" y="90" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">-18% Stereotype Mitigated</text>
  </g>

  <!-- Fleiss Kappa & 23,400 Benchmark note -->
  <g transform="translate(30, 142)">
    <text x="0" y="0" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8" font-weight="600" opacity="0.75">23,400+ NARRATIVES (ENGLISH &amp; HINDI) · FLEISS' &kappa; = 0.69 · POLITECNICO DI MILANO</text>
  </g>
</svg>
