<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pIotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </linearGradient>
  </defs>

  <rect width="460" height="260" rx="12" fill="url(#pIotBg)" stroke="#2d1b3b" stroke-width="1.5"/>

  <!-- Top label -->
  <text x="24" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">IOT ML FRAMEWORK · SPRINGER 2023</text>

  <!-- Flow Boxes -->
  <!-- Box 1: IoT Sensing Layer -->
  <g transform="translate(24, 48)">
    <rect width="115" height="84" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">IoT Edge Sensors</text>
    <rect x="10" y="32" width="95" height="15" rx="3" fill="#1e293b"/>
    <text x="57" y="43" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Physiological Data</text>
    <rect x="10" y="50" width="95" height="15" rx="3" fill="#3b1d4c"/>
    <text x="57" y="61" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Telemetry Signals</text>
    <text x="57" y="76" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Continuous Stream</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 143 90 L 165 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="169,90 162,86 162,94" fill="#f472b6"/>

  <!-- Box 2: AutoML & Feature Engineering -->
  <g transform="translate(173, 48)">
    <rect width="115" height="84" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AutoML Engine</text>
    <text x="57" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">EvalML Pipeline</text>
    <text x="57" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">GridSearchCV Tuning</text>
    <rect x="10" y="62" width="95" height="14" rx="3" fill="#381335"/>
    <text x="57" y="72" fill="#f472b6" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Feature Selection</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 292 90 L 314 90" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="318,90 311,86 311,94" fill="#f472b6"/>

  <!-- Box 3: Ensemble Classification -->
  <g transform="translate(322, 48)">
    <rect width="114" height="84" rx="8" fill="#241635" stroke="#10b981" stroke-width="1.2"/>
    <text x="57" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Classifier Model</text>
    <rect x="10" y="34" width="94" height="18" rx="4" fill="#064e3b"/>
    <text x="57" y="46" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Random Forest</text>
    <rect x="10" y="56" width="94" height="18" rx="4" fill="#1e293b"/>
    <text x="57" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Neural Baseline</text>
  </g>

  <!-- Bottom visual: Diagnostics Accuracy Metric -->
  <g transform="translate(24, 150)">
    <rect width="412" height="90" rx="8" fill="#1b1228" stroke="#372046" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Model Evaluation &amp; Accuracy Comparison:</text>
    
    <g transform="translate(16, 36)">
      <text x="0" y="14" fill="#cbd5e1" font-size="8">Tuned Random Forest:</text>
      <rect x="130" y="4" width="180" height="12" rx="3" fill="#10b981"/>
      <text x="320" y="14" fill="#34d399" font-size="8" font-weight="700">97.8% Accuracy</text>

      <text x="0" y="36" fill="#cbd5e1" font-size="8">Baseline Classifier:</text>
      <rect x="130" y="26" width="130" height="12" rx="3" fill="#64748b" opacity="0.6"/>
      <text x="270" y="36" fill="#94a3b8" font-size="8">88.4% Accuracy</text>
    </g>

    <text x="16" y="80" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" opacity="0.8">Wireless Personal Communications · Springer · IoT Edge Diagnostics</text>
  </g>
</svg>
