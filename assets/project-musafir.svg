<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="musafirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#musafirBg)"/>

  <!-- World map outline dots / background -->
  <g fill="#334155" opacity="0.4">
    <circle cx="80" cy="80" r="2"/><circle cx="95" cy="85" r="2"/><circle cx="110" cy="75" r="2"/>
    <circle cx="200" cy="70" r="2"/><circle cx="220" cy="80" r="2"/><circle cx="235" cy="65" r="2"/>
    <circle cx="300" cy="90" r="2"/><circle cx="320" cy="110" r="2"/><circle cx="335" cy="100" r="2"/>
  </g>

  <!-- Flight Arc (Barcelona -> Milan -> Worldwide) -->
  <path d="M 90,130 Q 200,30 310,120" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Origin Airport Node -->
  <g transform="translate(90, 130)">
    <circle r="14" fill="#881337" stroke="#fb7185" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">BCN</text>
  </g>

  <!-- Destination Airport Node -->
  <g transform="translate(310, 120)">
    <circle r="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text text-anchor="middle" dy="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">MXP</text>
  </g>

  <!-- Airplane Icon in Flight -->
  <g transform="translate(200, 75) rotate(15)">
    <path d="M 0,-10 L 4,-3 L 14,2 L 14,5 L 3,3 L 2,9 L 6,12 L 6,14 L 0,13 L -6,14 L -6,12 L -2,9 L -3,3 L -14,5 L -14,2 L -4,-3 Z" fill="#ffffff"/>
  </g>

  <!-- Travel Card Floating -->
  <g transform="translate(145, 140)">
    <rect width="110" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="55" y="16" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">FASTEST ROUTE</text>
    <text x="55" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="500">HackUPC Barcelona</text>
  </g>
</svg>
