<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pBiasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </linearGradient>
    <linearGradient id="pBiasAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="pBiasBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="460" height="260" rx="12" fill="url(#pBiasBg)" stroke="#2d1b3b" stroke-width="1.5"/>

  <!-- Top label -->
  <text x="24" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">METHODOLOGY ARCHITECTURE · EACL 2027</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Persona Conditioning -->
  <g transform="translate(24, 46)">
    <rect width="115" height="74" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Persona Prompts</text>
    <rect x="12" y="34" width="91" height="14" rx="4" fill="#3b1d4c"/>
    <text x="57" y="44" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Dark Triad Traits</text>
    <rect x="12" y="52" width="91" height="14" rx="4" fill="#1b2a47"/>
    <text x="57" y="62" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Honesty-Humility</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 143 83 L 165 83" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="169,83 162,79 162,87" fill="#f472b6"/>

  <!-- Box 2: Multilingual LLMs -->
  <g transform="translate(173, 46)">
    <rect width="115" height="74" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">6 Target LLMs</text>
    <text x="57" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Llama 3 · Gemma</text>
    <text x="57" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Mistral · DeepSeek</text>
    <text x="57" y="68" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">English &amp; Hindi (23K+)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 292 83 L 314 83" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="318,83 311,79 311,87" fill="#f472b6"/>

  <!-- Box 3: Evaluation Engine -->
  <g transform="translate(322, 46)">
    <rect width="114" height="74" rx="8" fill="#241635" stroke="#ec4899" stroke-width="1.2"/>
    <text x="57" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Bias &amp; Fluency</text>
    <text x="57" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">Centroid Metric</text>
    <text x="57" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.8" text-anchor="middle">BERTScore Tradeoff</text>
    <rect x="10" y="58" width="94" height="12" rx="3" fill="#381335"/>
    <text x="57" y="67" fill="#f472b6" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">&kappa; = 0.69 Human Match</text>
  </g>

  <!-- Comparison Bars at Bottom -->
  <g transform="translate(24, 140)">
    <rect width="412" height="100" rx="8" fill="#1b1228" stroke="#372046" stroke-width="1"/>
    
    <text x="16" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Dark Triad Amplification:</text>
    <rect x="150" y="12" width="160" height="13" rx="3" fill="url(#pBiasAccent)"/>
    <text x="320" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">+27% Gender Bias</text>

    <text x="16" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Baseline (Neutral):</text>
    <rect x="150" y="38" width="95" height="13" rx="3" fill="#64748b" opacity="0.65"/>
    <text x="255" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Reference Benchmark</text>

    <text x="16" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Honesty-Humility Trait:</text>
    <rect x="150" y="64" width="60" height="13" rx="3" fill="#10b981"/>
    <text x="220" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">-18% Stereotype Reduction</text>

    <text x="16" y="93" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" opacity="0.8">50 Occupations · 23,400+ Generated Stories · Politecnico di Milano</text>
  </g>
</svg>
