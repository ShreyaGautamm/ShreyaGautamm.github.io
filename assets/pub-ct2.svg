<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pCt2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </linearGradient>
    <linearGradient id="pGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="460" height="260" rx="12" fill="url(#pCt2Bg)" stroke="#352243" stroke-width="1.5"/>

  <!-- Top bar with Award tag -->
  <text x="24" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">COUNTER TURING TEST (CT²) PIPELINE · EMNLP 2023</text>
  <rect x="330" y="16" width="106" height="18" rx="9" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="383" y="28.5" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">🏆 Outstanding Paper</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Text Generation -->
  <g transform="translate(24, 48)">
    <rect width="115" height="82" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Input Corpora</text>
    <rect x="10" y="34" width="95" height="18" rx="4" fill="#1e293b"/>
    <text x="57" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Human Writing</text>
    <rect x="10" y="56" width="95" height="18" rx="4" fill="#3b1d4c"/>
    <text x="57" y="68" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">LLM Text (GPT-3/4)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 143 89 L 165 89" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="169,89 162,85 162,93" fill="#f472b6"/>

  <!-- Box 2: Robustness Attack Bench -->
  <g transform="translate(173, 48)">
    <rect width="115" height="82" rx="8" fill="#241635" stroke="#4a2559" stroke-width="1"/>
    <text x="57" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Adversarial Attacks</text>
    <text x="57" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Paraphrasing</text>
    <text x="57" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Token Substitution</text>
    <text x="57" y="70" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.8" font-weight="600" text-anchor="middle">Prompt Perturbations</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 292 89 L 314 89" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="318,89 311,85 311,93" fill="#f472b6"/>

  <!-- Box 3: AI Detectability Index (ADI) -->
  <g transform="translate(322, 48)">
    <rect width="114" height="82" rx="8" fill="#241635" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="57" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ADI Benchmark</text>
    <text x="57" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">6 SOTA Detectors</text>
    <text x="57" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Calibrated Accuracy</text>
    <rect x="8" y="62" width="98" height="14" rx="3" fill="#451a03"/>
    <text x="57" y="72" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Robustness Frontier</text>
  </g>

  <!-- Bottom Visual: Detector Calibration Curves -->
  <g transform="translate(24, 148)">
    <rect width="412" height="92" rx="8" fill="#1b1228" stroke="#372046" stroke-width="1"/>
    
    <!-- Mini graph grid -->
    <path d="M 40 72 L 390 72 M 40 46 L 390 46 M 40 20 L 390 20" stroke="#2d1b3b" stroke-width="1"/>
    
    <!-- Ideal frontier curve -->
    <path d="M 45 68 Q 120 40 220 28 T 385 24" stroke="url(#pGoldGrad)" stroke-width="2.5" fill="none"/>
    <text x="330" y="20" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">ADI Frontier</text>

    <!-- Deterioration curve -->
    <path d="M 45 68 Q 140 64 240 56 T 385 50" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
    <text x="320" y="46" fill="#f472b6" font-family="system-ui, sans-serif" font-size="7.5">Standard Detectors</text>

    <text x="45" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5">Perturbation Budget (&epsilon;)</text>
    <text x="310" y="84" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="end">EMNLP 2023 · Outstanding Paper</text>
  </g>
</svg>
