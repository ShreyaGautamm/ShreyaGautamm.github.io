<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Card -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#140718" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="pinkRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="roseViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="250" cy="210" r="140" fill="#f472b6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="210" r="100" fill="#fb7185" opacity="0.1" filter="url(#glow)"/>

  <!-- Network Edges / Connections -->
  <g stroke="#4a2245" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8">
    <line x1="250" y1="210" x2="110" y2="110"/>
    <line x1="250" y1="210" x2="390" y2="110"/>
    <line x1="250" y1="210" x2="90" y2="280"/>
    <line x1="250" y1="210" x2="410" y2="280"/>
    <line x1="250" y1="210" x2="250" y2="70"/>
    <line x1="250" y1="210" x2="250" y2="350"/>
    <line x1="110" y1="110" x2="250" y2="70"/>
    <line x1="390" y1="110" x2="250" y2="70"/>
    <line x1="90" y1="280" x2="250" y2="350"/>
    <line x1="410" y1="280" x2="250" y2="350"/>
  </g>

  <!-- Highlight Active Rays -->
  <g stroke="url(#pinkRose)" stroke-width="2">
    <line x1="250" y1="210" x2="160" y2="145" stroke-linecap="round"/>
    <line x1="250" y1="210" x2="340" y2="145" stroke-linecap="round"/>
    <line x1="250" y1="210" x2="350" y2="255" stroke-linecap="round"/>
    <line x1="250" y1="210" x2="150" y2="255" stroke-linecap="round"/>
  </g>

  <!-- Outer Satellite Nodes -->
  <!-- Top Node (NLP) -->
  <g transform="translate(250, 70)">
    <circle r="26" fill="url(#cardBg)" stroke="#f472b6" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">NLP</text>
  </g>

  <!-- Top-Left Node (Data) -->
  <g transform="translate(110, 110)">
    <circle r="24" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">DATA</text>
  </g>

  <!-- Top-Right Node (GenAI) -->
  <g transform="translate(390, 110)">
    <circle r="26" fill="url(#cardBg)" stroke="#fb7185" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">GenAI</text>
  </g>

  <!-- Bottom-Left Node (Eval) -->
  <g transform="translate(90, 280)">
    <circle r="25" fill="url(#cardBg)" stroke="#f472b6" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EVAL</text>
  </g>

  <!-- Bottom-Right Node (Models) -->
  <g transform="translate(410, 280)">
    <circle r="25" fill="url(#cardBg)" stroke="#fb7185" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">MODELS</text>
  </g>

  <!-- Bottom Node (Safety/Trust) -->
  <g transform="translate(250, 350)">
    <circle r="24" fill="url(#cardBg)" stroke="#e879f9" stroke-width="1.5"/>
    <text text-anchor="middle" dy="4" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TRUST</text>
  </g>

  <!-- Orbit Rings around Center -->
  <circle cx="250" cy="210" r="76" fill="none" stroke="#4a2245" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="250" cy="210" r="54" fill="none" stroke="url(#pinkRose)" stroke-width="1.5" opacity="0.6"/>

  <!-- Center Hub: LLM Core -->
  <g transform="translate(250, 210)">
    <!-- Back Pulse -->
    <circle r="44" fill="url(#cardBg)" stroke="#f472b6" stroke-width="2" filter="url(#subtleGlow)"/>
    <circle r="36" fill="url(#pinkRose)" opacity="0.2"/>
    
    <!-- Central Icon/Text -->
    <text text-anchor="middle" dy="-3" fill="#f472b6" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">LLM</text>
    <text text-anchor="middle" dy="12" fill="#d8b4e2" font-family="system-ui, sans-serif" font-size="8" font-weight="500" letter-spacing="0.5">RESEARCH</text>
  </g>

  <!-- Small floating decorative particles -->
  <circle cx="180" cy="180" r="3" fill="#f472b6" filter="url(#subtleGlow)"/>
  <circle cx="320" cy="180" r="3.5" fill="#fb7185" filter="url(#subtleGlow)"/>
  <circle cx="210" cy="280" r="2.5" fill="#c084fc"/>
  <circle cx="310" cy="270" r="3" fill="#f472b6"/>
  <circle cx="250" cy="135" r="2" fill="#e879f9"/>
</svg>
