<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#pestBg)"/>

  <!-- Satellite / Orbit -->
  <path d="M 40,80 Q 200,20 360,80" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Sentinel Satellite Icon -->
  <g transform="translate(180, 25)">
    <!-- Solar Panels -->
    <rect x="-35" y="5" width="25" height="14" rx="2" fill="#0284c7" stroke="#38bdf8"/>
    <rect x="10" y="5" width="25" height="14" rx="2" fill="#0284c7" stroke="#38bdf8"/>
    <!-- Body -->
    <rect x="-8" y="2" width="16" height="20" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
    <!-- Sensor beam down -->
    <polygon points="0,22 -60,150 60,150" fill="url(#radarSweep)"/>
  </g>

  <!-- Geospatial Crop Heatmap Grid -->
  <g transform="translate(100, 115)">
    <!-- 4x3 Grid of Agricultural Plots -->
    <rect x="0" y="0" width="45" height="30" rx="4" fill="#15803d" stroke="#22c55e" opacity="0.8"/>
    <rect x="50" y="0" width="45" height="30" rx="4" fill="#84cc16" stroke="#a3e635" opacity="0.8"/>
    <rect x="100" y="0" width="45" height="30" rx="4" fill="#eab308" stroke="#fde047" opacity="0.9"/>
    <rect x="150" y="0" width="45" height="30" rx="4" fill="#dc2626" stroke="#ef4444" opacity="0.9"/>

    <rect x="0" y="35" width="45" height="30" rx="4" fill="#166534" stroke="#22c55e" opacity="0.8"/>
    <rect x="50" y="35" width="45" height="30" rx="4" fill="#ca8a04" stroke="#eab308" opacity="0.8"/>
    <rect x="100" y="35" width="45" height="30" rx="4" fill="#ef4444" stroke="#f87171" opacity="0.9"/>
    <rect x="150" y="35" width="45" height="30" rx="4" fill="#15803d" stroke="#22c55e" opacity="0.8"/>
    
    <!-- Pest hotspot indicator -->
    <circle cx="172" cy="15" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="172" cy="15" r="3" fill="#ffffff"/>
  </g>

  <!-- Tag -->
  <g transform="translate(30, 20)">
    <rect width="115" height="22" rx="4" fill="#065f46"/>
    <text x="57" y="15" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SENTINEL-2 + XGBOOST</text>
  </g>

  <g transform="translate(290, 150)">
    <rect width="80" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="15" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ALERT: HIGH</text>
  </g>
</svg>
